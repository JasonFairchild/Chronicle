# https://lefthook.dev/configuration/
pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,vue,js,json,css,md,html}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,vue,js}'
      run: npx eslint --cache {staged_files}
    typecheck-and-unit:
      # Whole-project checks, so they run on a copy of the index when the tree differs from it
      run: node scripts/checkStaged.ts

pre-push:
  commands:
    browser:
      run: npm run test:browser
    cypress:
      run: npm run cy:run
